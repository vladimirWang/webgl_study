<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="./lib/index.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      #canvas::after {
        content: "  ";
        height: 1px;
        width: 400px;
        position: absolute;
        top: 200px;
        left: 0;
        background-color: aqua;
      }
      #canvas::before {
        content: "  ";
        height: 1px;
        width: 400px;
        position: absolute;
        left: 200px;
        top: 0;
        background-color: yellow;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" width="400" height="400" style="background-color: grey"
      >不支持canvas</canvas
    >
  </body>
  <script>
    const ele = document.getElementById("canvas");
    const gl = ele.getContext("webgl");

    const VERTEX_SHADER_SOURCE = `
        attribute vec4 aPosition;
        attribute float deg;
        void main(){
          gl_Position.x = aPosition.x * cos(deg) - aPosition.y * sin(deg);
          gl_Position.y = aPosition.x * sin(deg) + aPosition.y * cos(deg);
          gl_Position.z = aPosition.z;
          gl_Position.w = aPosition.w;
            //gl_Position=aPosition;
            // gl_PointSize=5.0;
        }
    `;

    const FRAGMENT_SHADER_SOURCE = `
        void main(){
            // vec4(1.0,0.0,0.0,1.0) x, y, z, a(透明度)
            gl_FragColor=vec4(1.0,0.0,0.0,1.0);
        }
    `;
    const program = initShader(
      gl,
      VERTEX_SHADER_SOURCE,
      FRAGMENT_SHADER_SOURCE
    );
    const points = new Float32Array([0.0, 0.5, 0.5, -0.5, -0.5, -0.5]);
    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, points, gl.STATIC_DRAW);

    const aPosition = gl.getAttribLocation(program, "aPosition");
    const deg = gl.getAttribLocation(program, "deg");

    gl.vertexAttribPointer(aPosition, 2, gl.FLOAT, false, 0, 0);

    gl.enableVertexAttribArray(aPosition);

    let x = 1;
    function animation() {
      x += 0.01;
      gl.vertexAttrib1f(deg, x);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      requestAnimationFrame(animation);
    }
    animation();
  </script>
</html>
