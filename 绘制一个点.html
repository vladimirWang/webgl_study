<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="./lib/index.js"></script>
  </head>
  <body>
    <canvas id="canvas" width="400" height="400">不支持canvas</canvas>
  </body>
  <script>
    const ele = document.getElementById("canvas");
    const gl = ele.getContext("webgl");

    const VERTEX_SHADER_SOURCE = `
        // 必须要有main函数
        void main(){
        // 点的坐标
        // vec4(1.0,0.0,0.0,1.0) x, y, z, w(齐次坐标)
            gl_Position=vec4(0.0,0.0,0.0,1.0);
            // 点的大小
            gl_PointSize=10.0;
        }
    `;

    const FRAGMENT_SHADER_SOURCE = `
        void main(){
            // vec4(1.0,0.0,0.0,1.0) x, y, z, a(透明度)
            gl_FragColor=vec4(1.0,0.0,0.0,1.0);
        }
    `;
    initShader(gl, VERTEX_SHADER_SOURCE, FRAGMENT_SHADER_SOURCE);

    // 执行绘制
    // 要绘制的图形是什么，从哪个开始， 使用几个顶点
    gl.drawArrays(gl.POINTS, 0, 1);
    // gl.drawArrays(gl.LINES, 0, 1);
    // gl.drawArrays(gl.TRIANGLES, 0, 1);

    // 3个顶点
    // 0.0  0.0  0.0
    // 0.2  0.0  0.0
    // 0.4  0.0  0.0
    gl.drawArrays(gl.POINTS, 0, 1);
    gl.drawArrays(gl.LINES, 1, 2);
  </script>
</html>
