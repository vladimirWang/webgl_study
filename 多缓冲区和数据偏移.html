<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="./lib/index.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      #canvas::after {
        content: "  ";
        height: 1px;
        width: 400px;
        position: absolute;
        top: 200px;
        left: 0;
        background-color: aqua;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" width="400" height="400" style="background-color: grey"
      >不支持canvas</canvas
    >
  </body>
  <script>
    const ele = document.getElementById("canvas");
    const gl = ele.getContext("webgl");

    const VERTEX_SHADER_SOURCE = `
        attribute vec4 aPosition;
        attribute float aPointSize;
        void main(){
            //gl_Position=vec4(aPosition.x * aScale, aPosition.y * aScale, 0.0, 1.0); // 默认值是vec4(0.0,0.0,0.0,1.0)
            gl_Position=aPosition;
            gl_PointSize=aPointSize;
        }
    `;

    const FRAGMENT_SHADER_SOURCE = `
        void main(){
            // vec4(1.0,0.0,0.0,1.0) x, y, z, a(透明度)
            gl_FragColor=vec4(1.0,0.0,0.0,1.0);
        }
    `;
    const program = initShader(
      gl,
      VERTEX_SHADER_SOURCE,
      FRAGMENT_SHADER_SOURCE
    );
    const points = new Float32Array([0.0, 0.5, 0.5, -0.5, -0.5, -0.5]);
    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, points, gl.STATIC_DRAW);

    const aPosition = gl.getAttribLocation(program, "aPosition");
    const aPointSize = gl.getAttribLocation(program, "aPointSize");

    gl.vertexAttribPointer(aPosition, 2, gl.FLOAT, false, 0, 0);

    gl.enableVertexAttribArray(aPosition);

    const size = new Float32Array([10.0, 20.0, 30.0]);
    const sizeBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, sizeBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, size, gl.STATIC_DRAW);
    gl.vertexAttribPointer(aPointSize, 1, gl.FLOAT, false, 0, 0);
    gl.enableVertexAttribArray(aPointSize);
    gl.drawArrays(gl.POINTS, 0, 3);
  </script>
</html>
