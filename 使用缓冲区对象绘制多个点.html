<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="./lib/index.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      #canvas {
        margin: 55px auto 0;
        display: block;
        background-color: yellow;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" width="400" height="400">不支持canvas</canvas>
  </body>
  <script>
    const ele = document.getElementById("canvas");
    const gl = ele.getContext("webgl");

    const VERTEX_SHADER_SOURCE = `
        // 必须要有main函数
        attribute vec4 aPosition;
        void main(){
        // 点的坐标
        // vec4(1.0,0.0,0.0,1.0) x, y, z, w(齐次坐标)
            gl_Position=aPosition;
            // 点的大小
            gl_PointSize=10.0;
        }
    `;

    const FRAGMENT_SHADER_SOURCE = `
        // 设置片元精度
        precision mediump float;
        // uniform vec4 uColor;
        uniform vec2 uColor;
        void main(){
            // vec4(1.0,0.0,0.0,1.0) x, y, z, a(透明度)
            gl_FragColor=vec4(uColor.r, uColor.g, 0.0, 1.0); // uColor;
        }
    `;
    const program = initShader(
      gl,
      VERTEX_SHADER_SOURCE,
      FRAGMENT_SHADER_SOURCE
    );

    // 执行绘制
    // 要绘制的图形是什么，从哪个开始， 使用几个顶点
    // gl.drawArrays(gl.POINTS, 0, 1);
    // gl.drawArrays(gl.LINES, 0, 1);
    // gl.drawArrays(gl.TRIANGLES, 0, 1);

    // 3个顶点
    // 0.0  0.0  0.0
    // 0.2  0.0  0.0
    // 0.4  0.0  0.0
    // gl.drawArrays(gl.POINTS, 0, 1);
    // gl.drawArrays(gl.LINES, 1, 2);

    const aPosition = gl.getAttribLocation(program, "aPosition");
    const uColor = gl.getUniformLocation(program, "uColor");

    const points = new Float32Array([-0.5, -0.5, 0.5, -0.5, 0.0, 0.5]);

    const buffer = gl.createBuffer();
    // 缓冲区存储的是顶点数据，gl.ARRAY_BUFFER
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);

    // gl.bufferData(target, data, type)
    // type可以是gl.STATIC_DRAW 写入一次，多次绘制
    // gl.STREAM_DRAW 写入一次，绘制若干次
    // gl.DYNAMIC_DRAW 写入多次，绘制多次

    gl.bufferData(gl.ARRAY_BUFFER, points, gl.STATIC_DRAW);

    // vertexAttribPointer(location, size, type, normalized, stride, offset)
    // type gl.FLOAT, gl.UNSIGNED_BYTE gl.SHORT
    // normalized 是否将数据归一化到 【0,1】【-1,1】这个区间
    // stride 两个顶点间的字节数据
    gl.vertexAttribPointer(aPosition, 2, gl.FLOAT, false, 0, 0);

    gl.enableVertexAttribArray(aPosition);
    gl.drawArrays(gl.ARRAYS, 0, 3);
  </script>
</html>
